<link href="https://fonts.googleapis.com/css2?family=Onest:wght@700;800&family=Unbounded:wght@900&display=swap" rel="stylesheet">
<style>
:root{--s:#47cef7;--k:#14142b;--p:#5b3de0;--l:#c3ff00;--y:#ffe600;--d:#2a6f94}
html{font-size:calc(min(100vw,480px)/24.375)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body{background:var(--s);color:var(--k);font:700 1rem Onest,sans-serif;height:100vh;overflow:hidden;overscroll-behavior:none}
button{font-family:Unbounded,sans-serif;font-weight:900;color:var(--k);cursor:pointer}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:none}
.scr{position:fixed;inset:0 0 15% 0;display:none;flex-direction:column;padding:1.5rem;max-width:480px;margin:auto;justify-content:center}
.scr.on{display:flex}
.t{font:900 2.3rem/1.05 Unbounded,sans-serif;letter-spacing:-.03em}
.t b{display:inline-block;background:var(--p);color:#fff;font-size:2.4rem;padding:.25rem .7rem;margin:.5rem 0 0 -.5rem;border:.15rem solid var(--k);box-shadow:.35rem .35rem 0 var(--k);transform:rotate(-2deg)}
.card{background:#fff;border:.2rem solid var(--k);border-radius:1.6rem;box-shadow:.55rem .55rem 0 var(--k);padding:1.1rem 1.4rem}
#m .card{margin-top:1.8rem}
.card p{font-size:1.15rem;line-height:1.3;font-weight:800}
.card i{display:block;margin-top:.5rem;font-style:normal;color:var(--p)}
.sp{display:flex;gap:1.4rem;justify-content:center;align-items:center;margin:1.8rem 0}
.sp div{display:flex;justify-content:center;align-items:center}
.sp img{height:8.5rem;width:auto;object-fit:contain}
.play{width:100%;padding:1.1rem;border:0;border-radius:1.6rem;background:var(--k);color:var(--l);font-size:1.9rem;box-shadow:0 .4rem 0 var(--p);margin-top:.4rem}
.row{display:flex;gap:1rem;margin-top:1.1rem}
.sec{flex:1;padding:1rem;border:.2rem solid var(--k);border-radius:1.6rem;background:#fff;font-size:1.2rem;box-shadow:.3rem .3rem 0 var(--k)}
.off{background:none;border:.2rem dashed var(--d);color:var(--d);box-shadow:none}
small{text-align:center;margin-top:.9rem;color:var(--d);font-size:.9rem}
.gr{position:fixed;left:0;right:0;bottom:0;height:15%;background:var(--l);border-top:.3rem solid var(--k)}
#o{justify-content:center;background:rgba(71,206,247,.7);padding-top:1rem}
#o h2,.hd h2{font:900 1.8rem/1.1 Unbounded,sans-serif;margin-bottom:.8rem}
#o .n{font:900 3.4rem Unbounded,sans-serif;color:var(--p)}
#o .q{font-size:.95rem;margin-top:.7rem;opacity:.75}
.hd{display:flex;align-items:center;gap:1rem;margin-bottom:1rem}
.hd h2{margin:0}.hd .sec{flex:none;padding:.6rem 1rem}
.L{overflow:auto;flex:1;padding:0 .4rem .4rem 0;touch-action:pan-y}
.r{display:flex;align-items:center;gap:.8rem;background:#fff;border:.18rem solid var(--k);border-radius:1.2rem;padding:.55rem .8rem;margin-bottom:.6rem}
.r.me{background:var(--y)}
.r b{width:1.6rem;font-family:Unbounded,sans-serif;font-size:.9rem}
.r span:nth-child(3){flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r em{font:900 1rem Unbounded,sans-serif;font-style:normal}
.av{position:relative;width:2.4rem;height:2.4rem;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;overflow:hidden;flex:none}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<main id="m" class="scr on">
<h1 class="t">СПАСИ ЧАТ<br><b>МАЗЕЛОВА</b></h1>
<div class="card"><p id="qt"></p><i id="qn"></i></div>
<div class="sp">
  <div><img id="i1" src="./img/player.png"></div>
  <div><img id="i2" src="./img/boss.png"></div>
</div>
<button class="play" id="pl">ИГРАТЬ</button>
<div class="row"><button class="sec" id="tp">ТОП</button><button class="sec off" disabled>СКИНЫ</button></div>
<small>скинов покашо нет тут покашо нихуч нет патом будет</small>
</main>
<div class="gr"></div>
<section id="t" class="scr"><div class="hd"><button class="sec" id="bk">←</button><h2>ТОП ЧАТА</h2></div><div class="L" id="L"></div></section>
<section id="o" class="scr"></section>
<script>
(()=>{
  const IM = {
  il: "./img/player.png", // Спрайт игрока
  bl: "./img/bullet.png", // Спрайт снаряда/пули
  hv: "./img/boss.png"    // Спрайт босса/цели
};
const Q=[["Я не хотел репорт кидать","blue"],["Вот это уже пиздец настоящий, умри ебанутый","артем"], ["я ел гавно", "ілюша"]];
const FB={apiKey:"AIzaSyBAnZWyL-ZrU3egfVbomay6G1DNA_zp5As",authDomain:"mzlffchat.firebaseapp.com",projectId:"mzlffchat",appId:"1:401998690106:web:4f1da7f73eb3993bb70203"};

const T=window.Telegram?.WebApp,$=s=>document.querySelector(s),R=(a,b)=>a+Math.random()*(b-a),C=(v,a,b)=>Math.max(a,Math.min(b,v));
try{T.ready();T.expand();T.disableVerticalSwipes?.();T.setHeaderColor?.('#47cef7');T.setBackgroundColor?.('#47cef7')}catch{}
const hz=(f,k)=>{try{T.HapticFeedback[f](k)}catch{}};
const U=T?.initDataUnsafe?.user,uid=U?'t'+U.id:(localStorage.uid||=('l'+Math.random().toString(36).slice(2,10)));
const me={name:[U?.first_name,U?.last_name].filter(Boolean).join(' ')||'аноним',photo:/^https:\/\//.test(U?.photo_url||'')?U.photo_url:''};
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');

let db,FV,sid,sb=0;
try{if(FB.apiKey){firebase.initializeApp(FB);db=firebase.firestore();FV=firebase.firestore.FieldValue;
db.collection('scores').doc(uid).get().then(s=>{if(s.exists)sb=s.data().score}).catch(()=>{})}}catch{}
const send=()=>{if(!db||!sid||!ok()||a<=sb)return;const s=a;
db.collection('scores').doc(uid).set({name:me.name.slice(0,32),photo:me.photo,score:s,sid,t:FV.serverTimestamp()}).then(()=>sb=s).catch(()=>{})};

// Загружаем картинки напрямую без base64
const IMG = { il: $('#i1'), hv: $('#i2'), bl: new Image() };
IMG.bl.src = "./img/bullet.png";

const W=390,GH=64,PW=58,PH=72,HW=76,HH=93,HT=58,cv=$('#cv'),x=cv.getContext('2d');
const KEY=(Math.random()*1e9)|0;
let H,K,gy,st='m',px=W/2,tx=px,a=0,b=KEY,best=+localStorage.best||0,lives,wave,hhp,hmax,bs=[],pk=[],pt=[],pp=[],rg=[],t=0,tk=0,ck=0,pkT=0,cd=0,inv=0,sh=0,fl=0,hj=0,hint=0,shd=0,hx=W/2,d=null;
const add=n=>{a+=n;b=a^KEY},ok=()=>b===(a^KEY);

const rs=()=>{const r=Math.min(devicePixelRatio||1,2.5);cv.width=innerWidth*r;cv.height=innerHeight*r;K=cv.width/W;H=cv.height/K;gy=H-GH};
addEventListener('resize',rs);rs();

const scr=i=>{['m','t','o'].forEach(n=>$('#'+n).classList.toggle('on',n==i));cv.style.display=i=='m'||i=='t'?'none':'block'};
const pq=()=>{let i;do i=Math.random()*Q.length|0;while(Q.length>1&&i==+localStorage.lq);localStorage.lq=i;return Q[i]};
const menu=()=>{st='m';const q=pq();$('#qt').textContent='«'+q[0]+'»';$('#qn').textContent=q[1];scr('m')};

async function top(){st='m';scr('t');const L=$('#L');if(!db){L.textContent='Firebase не подключён';return}
L.textContent='загрузка…';
try{const s=await db.collection('scores').orderBy('score','desc').limit(50).get();let i=0;
L.innerHTML=s.docs.map(q=>{const v=q.data();i++;const n=esc(v.name);
return `<div class="r${q.id==uid?' me':''}"><b>${i}</b><span class="av">${esc(([...v.name][0]||'?').toUpperCase())}${/^https:\/\//.test(v.photo)?`<img src="${esc(v.photo)}" onerror="this.remove()">`:''}</span><span>${n}</span><em>${v.score}</em></div>`}).join('')||'пока пусто'}
catch{L.textContent='не удалось загрузить'}}

function go(){a=0;b=KEY;px=tx=W/2;lives=3;wave=1;nw();bs=[];pk=[];pt=[];pp=[];rg=[];t=tk=cd=inv=sh=fl=hj=shd=0;ck=1.5;pkT=5;hint=3.5;sid=null;
try{db?.collection('sessions').add({uid,t:FV.serverTimestamp()}).then(r=>sid=r.id).catch(()=>{})}catch{}
st='p';scr('g')}
const nw=()=>{hmax=hhp=Math.min(14,4+2*wave)};
const pop=(X,Y,s,c='#14142b')=>pp.push({x:X,y:Y,s,c,l:1});
const burst=(X,Y,c,n=10)=>{for(let i=0;i<n;i++)pt.push({x:X,y:Y,vx:R(-160,160),vy:R(-220,60),l:.6,c})};

function fire(){const v=Math.min(300,150+wave*14),ox=hx,oy=HT+46,p=(Math.random()*Math.min(4,wave+1))|0;
const m=(X,Y,vx,vy)=>bs.push({x:X,y:Y,vx,vy,r:14,f:0,a:R(0,6)});
if(p==0){const k=v/Math.hypot(px-ox,gy-oy);m(ox,oy,(px-ox)*k,(gy-oy)*k)}
else if(p==1)for(let i=0;i<3;i++)m(R(20,W-20),-10-i*55,0,v*R(.8,1.1));
else if(p==2)for(const g of[-.4,0,.4])m(ox,oy,Math.sin(g)*v,Math.cos(g)*v);
else{const g=Math.random()*7|0;for(let i=0;i<8;i++)if(i!=g&&i!=g+1)m((i+.5)*W/8,oy,0,v*.8)}}

function parry(){if(cd>0||st!='p')return;cd=.8;const cy=gy-PH*.5;rg.push({x:px,y:cy,r:10});hz('impactOccurred','medium');let n=0;
for(const o of bs)if(!o.f&&Math.hypot(o.x-px,o.y-cy)<95){o.f=1;n++}
if(n)pop(px,gy-110,n>1?'x'+n+'!':'ОТБИТО!','#5b3de0')}

function hurt(){if(shd){shd=0;pop(px,gy-100,'ЩИТ!','#5b3de0');burst(px,gy-40,'#5b3de0');return}
lives--;inv=1.3;sh=1;fl=1;hz('notificationOccurred','error');if(lives<=0)over()}

function over(){st='o';const nb=a>best,q=pq();if(nb){best=a;localStorage.best=a}if(ok())send();
$('#o').innerHTML=`<div class="card"><h2>РЕПОРТ<br>ОТПРАВЛЕН</h2><div class="n">${a}</div><p>${nb?'новый рекорд!':'рекорд '+best} · волна ${wave}</p><p class="q">«${esc(q[0])}»<br>— ${esc(q[1])}</p><button class="play" id="pl">ЕЩЁ РАЗ</button><div class="row"><button class="sec" id="mn">МЕНЮ</button><button class="sec" id="tp">ТОП</button></div></div>`;scr('o')}

function up(dt){t+=dt;hx=W/2+Math.sin(t*(.6+wave*.04))*(W/2-HW/2-6);
cd-=dt;inv-=dt;hint-=dt;hj=Math.max(0,hj-dt);sh=Math.max(0,sh-dt*3);fl=Math.max(0,fl-dt*3);
px+=C(tx-px,-1000*dt,1000*dt);px=C(px,PW/2,W-PW/2);tx=C(tx,PW/2,W-PW/2);
tk+=dt;if(tk>=1){tk-=1;add(1)}
ck-=dt;if(ck<=0){fire();ck=Math.max(.4,1.25-.07*wave)*R(.8,1.2)}
pkT-=dt;if(pkT<=0){pk.push({x:R(30,W-30),y:-20,k:Math.random()*4|0});pkT=R(5,9)}
const cy=gy-PH*.5;
for(const o of bs){
if(o.f){const dx=hx-o.x,dy=HT+HH/2-o.y,l=Math.hypot(dx,dy)||1,w=Math.min(1,dt*6);o.vx+=(dx/l*520-o.vx)*w;o.vy+=(dy/l*520-o.vy)*w;
if(l<44){o.d=1;hhp--;add(3);hj=.3;burst(o.x,o.y,'#ffe600',12);hz('impactOccurred','heavy');if(hhp<=0)clr()}}
o.x+=o.vx*dt;o.y+=o.vy*dt;o.a+=dt*3;
if(!o.f&&inv<=0&&Math.hypot(o.x-px,o.y-cy)<o.r+22){o.d=1;burst(o.x,o.y,'#5b3de0');hurt()}
if(o.y>H+40||o.x<-40||o.x>W+40||o.y<-250)o.d=1}
bs=bs.filter(o=>!o.d);
for(const o of pk){o.y+=80*dt;if(Math.hypot(o.x-px,o.y-cy)<36){o.d=1;
if(o.k==2){shd=1;pop(px,gy-100,'ЩИТ','#5b3de0')}else if(o.k==3&&lives<3){lives++;pop(px,gy-100,'+1 ❤','#e0245e')}else{add(5);pop(px,gy-100,'+5','#14142b')}hz('impactOccurred','light')}
if(o.y>H+20)o.d=1}
pk=pk.filter(o=>!o.d);
for(const o of pt){o.l-=dt;o.x+=o.vx*dt;o.y+=o.vy*dt;o.vy+=600*dt}pt=pt.filter(o=>o.l>0);
for(const o of pp){o.l-=dt;o.y-=40*dt}pp=pp.filter(o=>o.l>0);
for(const o of rg){o.r+=380*dt}rg=rg.filter(o=>o.r<95)}
function clr(){wave++;add(20);for(const o of bs)burst(o.x,o.y,'#5b3de0',5);bs=[];nw();ck=2;pop(W/2,H*.4,'ВОЛНА '+wave);hz('notificationOccurred','success')}

function dr(){x.setTransform(K,0,0,K,0,0);x.fillStyle='#47cef7';x.fillRect(0,0,W,H);x.save();
if(sh)x.translate(R(-1,1)*sh*6,R(-1,1)*sh*6);
x.fillStyle='#c3ff00';x.fillRect(0,gy,W,GH);x.fillStyle='#14142b';x.fillRect(0,gy,W,3);
x.drawImage(IMG.hv,hx-HW/2+Math.sin(t*70)*hj*14,HT,HW,HH);
x.fillStyle='#14142b';x.fillRect(hx-HW/2,HT+HH+4,HW,9);x.fillStyle='#5b3de0';x.fillRect(hx-HW/2+1.5,HT+HH+5.5,(HW-3)*Math.max(0,hhp)/hmax,6);
const cy=gy-PH*.5;
if(cd<=0){x.strokeStyle='rgba(255,255,255,.55)';x.lineWidth=2;x.setLineDash([6,6]);x.beginPath();x.arc(px,cy,95,0,7);x.stroke();x.setLineDash([])}
x.globalAlpha=inv>0&&(t*20|0)%2?.4:1;x.drawImage(IMG.il,px-PW/2,gy-PH+6+Math.sin(t*5)*1.5,PW,PH);x.globalAlpha=1;
if(shd){x.strokeStyle='#5b3de0';x.lineWidth=3;x.beginPath();x.arc(px,cy,40,0,7);x.stroke()}
for(const o of bs){x.save();x.translate(o.x,o.y);x.rotate(Math.sin(o.a)*.4);x.drawImage(IMG.bl,-17,-18.5,34,37);x.restore()}
x.textAlign='center';x.textBaseline='middle';x.font='24px sans-serif';
for(const o of pk)x.fillText(['⭐','⭐','🛡️','❤️'][o.k],o.x,o.y);
x.strokeStyle='#fff';x.lineWidth=3;for(const o of rg){x.globalAlpha=1-o.r/95;x.beginPath();x.arc(o.x,o.y,o.r,0,7);x.stroke()}
for(const o of pt){x.globalAlpha=Math.max(0,o.l*1.6);x.fillStyle=o.c;x.fillRect(o.x-3,o.y-3,6,6)}x.globalAlpha=1;
x.font='900 20px Unbounded,sans-serif';x.lineWidth=5;x.lineJoin='round';
for(const o of pp){x.globalAlpha=Math.min(1,o.l*2);x.strokeStyle='#fff';x.strokeText(o.s,o.x,o.y);x.fillStyle=o.c;x.fillText(o.s,o.x,o.y)}x.globalAlpha=1;
x.font='900 15px Unbounded,sans-serif';x.fillStyle='#14142b';x.textAlign='left';x.fillText('❤️'.repeat(Math.max(0,lives)),14,26);
x.textAlign='right';x.fillText(a,W-14,26);x.textAlign='center';x.fillText('ВОЛНА '+wave,W/2,26);
if(hint>0&&st=='p'){x.globalAlpha=Math.min(1,hint);x.font='800 15px Onest,sans-serif';x.fillText('тащи пальцем · тап = отбить',W/2,H*.5);x.globalAlpha=1}
x.restore();if(fl>0){x.globalAlpha=fl*.3;x.fillStyle='#ff2d55';x.fillRect(0,0,W,H);x.globalAlpha=1}}

cv.onpointerdown=e=>{if(st!='p')return;if(d){parry();return}d={id:e.pointerId,x:e.clientX,p:px,t:performance.now(),m:0};cv.setPointerCapture(e.pointerId)};
cv.onpointermove=e=>{if(!d||e.pointerId!=d.id)return;const v=(e.clientX-d.x)*W/innerWidth;if(Math.abs(v)>6)d.m=1;if(d.m)tx=d.p+v};
cv.onpointerup=cv.onpointercancel=e=>{if(!d||e.pointerId!=d.id)return;if(!d.m&&performance.now()-d.t<300)parry();d=null};
document.onclick=e=>({pl:go,tp:top,mn:menu,bk:menu})[e.target.id]?.();
document.addEventListener('contextmenu',e=>e.preventDefault());

let l=0;const fr=n=>{const dt=Math.min(.033,(n-l)/1e3||0);l=n;if(st=='p')up(dt);if(st=='p'||st=='o')dr();requestAnimationFrame(fr)};
menu();requestAnimationFrame(fr);
})();
</script>
