<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Спаси ілюшу</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--sky:#47cef7;--ink:#111;--lime:#c3ff00;--blue:#5a3be0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--sky);overflow:hidden;overscroll-behavior:none;touch-action:none;
  font-family:"Comic Sans MS","Chalkboard SE","Marker Felt","Segoe Print",cursive,sans-serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative}
canvas{display:block;touch-action:none}
#ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:6%;
  background:rgba(71,206,247,.55);backdrop-filter:blur(3px)}
#ov.on{display:flex}
.card{background:#fff;border:5px solid var(--ink);border-radius:30px;padding:5% 6%;width:100%;max-width:92%;
  box-shadow:8px 10px 0 var(--ink);text-align:center;color:var(--ink);animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.7) rotate(-3deg);opacity:0}to{transform:none;opacity:1}}
.card h1{margin:.1em 0 .25em;font-size:clamp(26px,8.4vw,52px);line-height:1}
.card p{margin:.4em 0;font-size:clamp(15px,4.2vw,26px);line-height:1.25}
.card .rules{text-align:left;font-size:clamp(13px,3.7vw,22px);background:#eaf8ff;border:3px dashed var(--blue);border-radius:18px;padding:.6em .9em;margin:.7em 0}
.card .rules div{margin:.18em 0}
.hl{color:var(--blue);font-weight:700}
.bubble{font-size:clamp(14px,4.1vw,24px);line-height:1.25;position:relative;background:#f1ecff;border:4px solid var(--blue);border-radius:20px;padding:.5em .8em;margin:.5em 0 .9em;color:var(--blue);font-weight:700}
.bubble:after{content:"";position:absolute;left:34px;bottom:-16px;border:10px solid transparent;border-top-color:var(--blue)}
.btn{display:inline-block;margin-top:.5em;background:var(--ink);color:#fff;border:0;border-radius:999px;
  padding:.55em 1.6em;font:inherit;font-size:clamp(20px,6vw,34px);font-weight:700;cursor:pointer;
  box-shadow:0 6px 0 #555;transition:transform .08s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #555}
.big{font-size:clamp(40px,13vw,80px);margin:.1em 0}
.mini{font-size:clamp(12px,3.2vw,18px)!important;opacity:.7}
#mute{position:absolute;right:2.2%;top:1.5%;width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);
  background:#fff;font-size:22px;line-height:1;padding:0;cursor:pointer;display:none}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="cv"></canvas>
  <button id="mute" aria-label="звук">🔊</button>
  <div id="ov"><div class="card" id="card"></div></div>
</div></div>

/* ---------- world / canvas ---------- */
const W=1024; let H=1280,S=1,K=1;
const cv=$('#cv'),ctx=cv.getContext('2d'),stage=$('#stage');
let groundY=1180, il={x:50,y:0,w:306,h:380}, hive={x:770,y:150,w:190,h:232,hx:0,hy:0};
function resize(){
  const iw=window.innerWidth, ih=window.innerHeight;
  H=clamp(ih*W/iw,1000,2200); S=Math.min(iw/W,ih/H);
  const dpr=Math.min(window.devicePixelRatio||1,2.5); K=S*dpr;
  cv.width=Math.round(W*S*dpr); cv.height=Math.round(H*S*dpr);
  cv.style.width=W*S+'px'; cv.style.height=H*S+'px';
  stage.style.width=W*S+'px'; stage.style.height=H*S+'px';
  stage.style.fontSize=(S*16)+'px';
  groundY=H-110;
  il.x=50; il.y=groundY-il.h+30;
  hive.x=W-hive.w-70; hive.y=150;
  hive.hx=hive.x+hive.w*0.42; hive.hy=hive.y+hive.h*0.40;
}
window.addEventListener('resize',resize);
if(window.visualViewport) window.visualViewport.addEventListener('resize',resize);

/* ---------- audio ---------- */
let AC=null,muted=store('ilusha_mute')==='1';
function initAudio(){ if(AC) return; try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} }
function tone(f,d,type='sine',vol=.12,slide=0){
  if(!AC||muted) return;
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);
}
const sfx={
  shoot(){tone(300,.14,'triangle',.08,260)},
  bounce(){tone(520,.12,'square',.07,500)},
  hit(){tone(180,.3,'sawtooth',.14,-120)},
  hive(){tone(260,.2,'square',.1,-150);tone(130,.25,'triangle',.12)},
  win(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.2,'triangle',.12),i*110))},
  lose(){[400,320,240,160].forEach((f,i)=>setTimeout(()=>tone(f,.28,'sawtooth',.12),i*180))}
};
const muteBtn=$('#mute');
function paintMute(){muteBtn.textContent=muted?'🔇':'🔊'}
muteBtn.addEventListener('pointerdown',e=>{e.stopPropagation();muted=!muted;store('ilusha_mute',muted?'1':'0');paintMute();});

/* ---------- game state ---------- */
const LW=15, INK=1500, LIFE=3.0, FADE=.7, GRAV=1500;
let state='menu', level=1, lives=3, score=0, hiveMax=7, hiveHp=7, spawnT=1, volley=0, volleyT=0, timeAll=0;
let balls=[], strokes=[], parts=[], pops=[];
let shake=0, flash=0, hiveJig=0, hint=0, ilHit=0;
const pointers=new Map();
const clouds=[{x:220,y:210,s:1},{x:560,y:330,s:.8},{x:880,y:90,s:.7}];

function cfg(){
  const L=level;
  return { every:Math.max(.55,1.7-.13*L), T:Math.max(.95,1.55-.06*L), vol:L>=2?Math.min(.55,.15+.07*L):0, maxv:Math.min(4,1+Math.floor(L/2)) };
}
function startLevel(n,reset){
  level=n; if(reset){lives=3;score=0;} else lives=Math.min(3,lives+1);
  hiveMax=5+2*level; hiveHp=hiveMax; balls=[];strokes=[];parts=[];pops=[];
  spawnT=1.2; volley=0; hint=level===1&&reset?5:0; state='play'; hideOv();
}
function spawnBall(){
  const c=cfg();
  const sx=hive.hx, sy=hive.hy;
  const tx=il.x+il.w*.5+rnd(-130,120), ty=il.y+il.h*.38+rnd(-60,90);
  const T=c.T*rnd(.88,1.15);
  const vx=(tx-sx)/T, vy=(ty-sy-.5*GRAV*T*T)/T;
  balls.push({x:sx,y:sy,vx,vy,r:46,ref:false,rot:0,spin:rnd(-3,3),age:0});
  hiveJig=.25; sfx.shoot();
}
/* ---------- input ---------- */
function toWorld(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
function usedInk(){let u=0;for(const s of strokes){const a=s.done?clamp((LIFE-s.t)/FADE,0,1):1;u+=s.len*a;}return u;}
cv.addEventListener('pointerdown',e=>{
  initAudio(); if(state!=='play') return;
  e.preventDefault(); try{cv.setPointerCapture(e.pointerId);}catch(_){}
  if(usedInk()>=INK-1) return;
  const p=toWorld(e); const s={pts:[p],len:0,done:false,t:0};
  strokes.push(s); pointers.set(e.pointerId,s); hint=0;
});
cv.addEventListener('pointermove',e=>{
  const s=pointers.get(e.pointerId); if(!s||state!=='play') return; e.preventDefault();
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  for(const ev of (evs.length?evs:[e])){
    const p=toWorld(ev), l=s.pts[s.pts.length-1];
    const d=Math.hypot(p.x-l.x,p.y-l.y); if(d<7) continue;
    if(usedInk()+d>INK){ endStroke(e.pointerId); return; }
    s.pts.push(p); s.len+=d;
  }
});
function endStroke(id){const s=pointers.get(id);if(s){s.done=true;s.t=0;pointers.delete(id);}}
['pointerup','pointercancel','pointerleave'].forEach(t=>cv.addEventListener(t,e=>endStroke(e.pointerId)));
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- fx ---------- */
function burst(x,y,col,n=14,sp=420){for(let i=0;i<n;i++){const a=rnd(0,6.283),v=rnd(.3,1)*sp;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-80,life:rnd(.35,.7),max:.7,col,sz:rnd(6,14)});}}
function popup(x,y,text,col='#111'){pops.push({x,y,text,col,life:1});}

/* ---------- update ---------- */
function ilHit_test(b){
  const hx=il.x+il.w*.52, hy=il.y+il.h*.30, bx=il.x+il.w*.46, by=il.y+il.h*.76;
  return Math.hypot(b.x-hx,b.y-hy)<b.r+88 || Math.hypot(b.x-bx,b.y-by)<b.r+58;
}
function collideSeg(b,ax,ay,cx,cy){
  const abx=cx-ax, aby=cy-ay, L2=abx*abx+aby*aby||1;
  const t=clamp(((b.x-ax)*abx+(b.y-ay)*aby)/L2,0,1);
  const px=ax+abx*t, py=ay+aby*t; let dx=b.x-px, dy=b.y-py;
  const d=Math.hypot(dx,dy), R=b.r+LW/2;
  if(d>=R) return false;
  let nx,ny;
  if(d<1e-3){ nx=-aby;ny=abx;const l=Math.hypot(nx,ny)||1;nx/=l;ny/=l; if(nx*b.vx+ny*b.vy>0){nx=-nx;ny=-ny;} }
  else {nx=dx/d;ny=dy/d;}
  const vn=b.vx*nx+b.vy*ny;
  b.x=px+nx*R; b.y=py+ny*R;
  if(vn<0){
    const e=1.05;
    b.vx-=(1+e)*vn*nx; b.vy-=(1+e)*vn*ny;
    let sp=Math.hypot(b.vx,b.vy);
    // лёгкая помощь: подруливаем отражённый шарик в сторону улья
    const hx=hive.hx-b.x, hy=hive.hy-b.y, hl=Math.hypot(hx,hy)||1;
    if(sp<650){const k=650/sp;b.vx*=k;b.vy*=k;sp=650;}
    b.vx=b.vx*.8+hx/hl*sp*.2; b.vy=b.vy*.8+hy/hl*sp*.2;
    if(!b.ref){ b.ref=true; score+=1; popup(b.x,b.y-60,'отбито!','#5a3be0'); haptic.light(); sfx.bounce(); burst(b.x,b.y,'#5a3be0',8,260); }
    b.spin=rnd(-8,8);
  }
  return true;
}
function update(dt){
  timeAll+=dt;
  for(const c of clouds){c.x+=dt*10*c.s; if(c.x>W+200)c.x=-220;}
  hiveJig=Math.max(0,hiveJig-dt); shake=Math.max(0,shake-dt*3); flash=Math.max(0,flash-dt*2.5); ilHit=Math.max(0,ilHit-dt);
  hint=Math.max(0,hint-dt);
  for(const p of parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=900*dt;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.life-=dt;p.y-=60*dt;} pops=pops.filter(p=>p.life>0);
  if(state!=='play') return;

  // стрельба
  const c=cfg();
  if(volley>0){volleyT-=dt; if(volleyT<=0){spawnBall();volley--;volleyT=.28;}}
  else{ spawnT-=dt; if(spawnT<=0){ spawnBall(); spawnT=c.every*rnd(.8,1.25); if(Math.random()<c.vol){volley=Math.min(c.maxv,2+(Math.random()<.4?1:0))-1;volleyT=.28;} } }

  // штрихи
  for(const s of strokes){ if(s.done) s.t+=dt; }
  strokes=strokes.filter(s=>!s.done||s.t<LIFE);

  // шарики
  const sub=2, h=dt/sub;
  for(const b of balls){
    for(let k=0;k<sub;k++){
      b.vy+=GRAV*h; b.x+=b.vx*h; b.y+=b.vy*h; b.rot+=b.spin*h;
      for(const s of strokes){
        if(s.done&&LIFE-s.t<FADE*.3) continue;
        const P=s.pts; if(P.length===1){collideSeg(b,P[0].x,P[0].y,P[0].x+.1,P[0].y);continue;}
        for(let i=1;i<P.length;i++) collideSeg(b,P[i-1].x,P[i-1].y,P[i].x,P[i].y);
      }
    }
    b.age+=dt;
  }
  const keep=[];
  for(const b of balls){
    // попал в ілюшу
    if(!b.ref&&ilHit_test(b)){
      lives--; ilHit=.6; shake=1; flash=1; haptic.bad(); sfx.hit();
      burst(b.x,b.y,'#5a3be0',18,520); popup(il.x+il.w*.5,il.y-10,'blue пишет репорт…','#b0155a');
      if(lives<=0){ gameOver(); }
      continue;
    }
    // отбитый попал в улей
    if(b.ref && b.x>hive.x-10&&b.x<hive.x+hive.w+10&&b.y>hive.y-10&&b.y<hive.y+hive.h+10){
      hiveHp--; score+=5; hiveJig=.45; burst(b.x,b.y,'#ffd400',14,420); popup(b.x-30,b.y-40,'+5','#b0155a');
      haptic.heavy(); sfx.hive();
      if(hiveHp<=0){ levelClear(); }
      continue;
    }
    // упал / улетел
    if(b.y>groundY-20&&b.vy>0){ burst(b.x,groundY-20,'#5a3be0',6,200); continue; }
    if(b.x<-160||b.x>W+160||b.y<-500) continue;
    keep.push(b);
  }
  balls=keep;
}
function levelClear(){
  state='clear'; balls=[]; haptic.good(); sfx.win();
  if(score>best){best=score;saveBest();}
  showOv(`<div class="big">🎉</div><h1>Улей разбит!</h1>
   <div class="bubble">«ладно, репорт удалил… но я вернусь»<br>— blue</div>
   <p>Уровень <span class="hl">${level}</span> пройден · очки <span class="hl">${score}</span></p>
   <p class="mini">+1 звезда за храбрость. Дальше blue стреляет быстрее.</p>
   <button class="btn" id="go">Дальше →</button>`);
  $('#go').onclick=()=>startLevel(level+1,false);
}
function gameOver(){
  state='over'; balls=[]; sfx.lose();
  const nb=score>best; if(nb){best=score;saveBest();}
  showOv(`<div class="big">📨</div><h1>Репорт отправлен!</h1>
   <div class="bubble">«отправлено в чат Мазелова ✔✔»<br>— blue</div>
   <p>Ілюшу не спасли… Уровень <span class="hl">${level}</span> · очки <span class="hl">${score}</span></p>
   <p class="mini">${nb?'🏆 Новый рекорд!':'Рекорд: '+best}</p>
   <button class="btn" id="go">Спасти ещё раз</button>`);
  $('#go').onclick=()=>startLevel(1,true);
}
function menu(){
  state='menu';
  showOv(`<h1>Спаси ілюшу!</h1>
   <div class="bubble">«${userName?userName+', щас':'щас'} кину репорт на ілюшу в чате Мазелова 😈»<br>— blue</div>
   <p>Шарики <span class="hl">blue</span> летят в ілюшу. Спаси его!</p>
   <div class="rules">
     <div>✏️ Води пальцем — рисуй линию, шарик отскочит</div>
     <div>🐝 Отбей шарик в улей — разбей улей</div>
     <div>⭕ Круг вокруг ілюши — щит</div>
     <div>🖤 Чернила кончаются, но линии тают и они возвращаются</div>
     <div>⭐ 3 попадания — и репорт отправлен</div>
   </div>
   <button class="btn" id="go">Играть</button>
   ${best?`<p class="mini">Рекорд: ${best}</p>`:''}`);
  $('#go').onclick=()=>{initAudio();startLevel(1,true);};
}
const ov=$('#ov'),card=$('#card');
function showOv(html){card.innerHTML=html;ov.classList.add('on');muteBtn.style.display='block';paintMute();}
function hideOv(){ov.classList.remove('on');}

/* ---------- draw ---------- */
function drawCloud(x,y,s){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  const c=[[0,0,62],[70,-22,74],[142,6,58],[60,24,66],[-30,18,44]];
  ctx.fillStyle='#d7ecea'; for(const[a,b,r] of c){ctx.beginPath();ctx.arc(a,b,r+7,0,6.3);ctx.fill();}
  ctx.fillStyle='#fff'; for(const[a,b,r] of c){ctx.beginPath();ctx.arc(a,b,r,0,6.3);ctx.fill();}
  ctx.restore();
}
function star(x,y,r,col){
  ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;ctx[i?'lineTo':'moveTo'](x+Math.cos(a)*rr,y+Math.sin(a)*rr);}
  ctx.closePath();ctx.fillStyle=col;ctx.fill();
}
function pill(x,y,w,h,col){ctx.fillStyle=col;ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,h/2):ctx.rect(x,y,w,h);ctx.fill();}
function draw(){
  ctx.setTransform(K,0,0,K,0,0);
  ctx.fillStyle='#47cef7';ctx.fillRect(0,0,W,H);
  for(const c of clouds) drawCloud(c.x,c.y,c.s);

  // улей
  const jig=hiveJig>0?Math.sin(timeAll*60)*5*hiveJig/.45:0;
  ctx.save();ctx.translate(hive.x+hive.w/2+jig,hive.y+hive.h);ctx.scale(1+(hiveJig>0?.05*Math.sin(timeAll*40):0),1);
  ctx.drawImage(IMG.hive,-hive.w/2,-hive.h,hive.w,hive.h);ctx.restore();
  // HP улья
  if(state==='play'||state==='clear'){
    const bw=hive.w, bx=hive.x, by=hive.y+hive.h+14;
    pill(bx,by,bw,20,'rgba(255,255,255,.6)');
    if(hiveHp>0) pill(bx,by,Math.max(20,bw*hiveHp/hiveMax),20,'#b0155a');
    ctx.fillStyle='#111';ctx.font='700 22px "Comic Sans MS",cursive';ctx.textAlign='center';
    ctx.fillText('репорт blue',bx+bw/2,by+46);
  }

  // трава
  const gh=Math.round(1024/IMG.grass.width*IMG.grass.height);
  ctx.fillStyle='#c3ff00';ctx.fillRect(0,H-gh+90,W,gh);
  // ілюша (с тряской при попадании)
  ctx.save();
  const bob=Math.sin(timeAll*2.2)*5;
  let ox=0; if(ilHit>0) ox=Math.sin(timeAll*70)*14*(ilHit/.6);
  ctx.translate(il.x+ox,il.y+bob);
  ctx.drawImage(IMG.ilusha,0,0,il.w,il.h);
  if(ilHit>0){ctx.globalCompositeOperation='source-atop';ctx.globalAlpha=.0;}
  ctx.restore();
  if(ilHit>0){ // красная вспышка поверх силуэта
    ctx.save();ctx.globalAlpha=ilHit/.6*.55;ctx.fillStyle='#ff2d55';
    ctx.beginPath();ctx.ellipse(il.x+il.w*.5+ox,il.y+il.h*.45+bob,il.w*.36,il.h*.45,0,0,6.3);ctx.fill();ctx.restore();
  }
  ctx.drawImage(IMG.grass,0,H-gh,1024,gh);

  // линии
  ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=LW;
  for(const s of strokes){
    const a=s.done?clamp((LIFE-s.t)/FADE,0,1):1;
    ctx.globalAlpha=a;ctx.strokeStyle='#0b0b0b';ctx.beginPath();
    s.pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
    if(s.pts.length===1)ctx.lineTo(s.pts[0].x+.1,s.pts[0].y);
    ctx.stroke();
  }
  ctx.globalAlpha=1;

  // шарики
  for(const b of balls){
    ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.rot*.35);
    const w=IMG.ball.width*.95,h=IMG.ball.height*.95;
    ctx.drawImage(IMG.ball,-w/2,-h/2+8,w,h);ctx.restore();
  }
  // частицы
  for(const p of parts){ctx.globalAlpha=clamp(p.life/p.max*1.4,0,1);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.sz*.5,0,6.3);ctx.fill();}
  ctx.globalAlpha=1;
  // всплывашки
  ctx.textAlign='center';ctx.font='700 38px "Comic Sans MS","Chalkboard SE",cursive';
  for(const p of pops){ctx.globalAlpha=clamp(p.life*1.6,0,1);ctx.lineWidth=7;ctx.strokeStyle='#fff';ctx.strokeText(p.text,p.x,p.y);ctx.fillStyle=p.col;ctx.fillText(p.text,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD: чернила
  const ink=clamp(1-usedInk()/INK,0,1);
  pill(24,32,680,62,'#cfe7e0'); if(ink>.01) pill(24,32,Math.max(62,680*ink),62,'#000');
  for(let i=0;i<3;i++){ star(70+i*95,150,38,i<lives?'#ffdf1c':'#000'); }
  ctx.fillStyle='#111';ctx.textAlign='left';ctx.font='700 36px "Comic Sans MS","Chalkboard SE",cursive';
  ctx.fillText('уровень '+level+'  ·  очки '+score,28,235);

  // подсказка
  if(hint>0&&state==='play'){
    ctx.globalAlpha=clamp(hint,0,1);ctx.textAlign='center';ctx.font='700 46px "Comic Sans MS",cursive';
    ctx.lineWidth=9;ctx.strokeStyle='#fff';
    const y=H*.52; ctx.strokeText('✏️ рисуй линии пальцем!',W/2,y);ctx.fillStyle='#111';ctx.fillText('✏️ рисуй линии пальцем!',W/2,y);
    ctx.globalAlpha=1;
  }
  // красная вспышка экрана
  if(flash>0){ctx.globalAlpha=flash*.28;ctx.fillStyle='#ff2d55';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
}

/* ---------- loop ---------- */
let last=0;
function frame(t){
  const dt=Math.min(.033,(t-last)/1000||0);last=t;
  update(dt);
  if(shake>0){ctx.setTransform(1,0,0,1,0,0);}
  draw();
  requestAnimationFrame(frame);
}
loaded.then(()=>{resize();paintMute();menu();requestAnimationFrame(frame);});
window.__game={get state(){return state},get lives(){return lives},get score(){return score},get balls(){return balls},get hive(){return hive},get il(){return il},get W(){return W},get H(){return H},start:()=>startLevel(1,true)};
})();
</script>
