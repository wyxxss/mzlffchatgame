<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Спаси чат Мазелова</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@700;800&family=Unbounded:wght@900&display=swap" rel="stylesheet">
<style>
:root{
  --s:#47cef7;
  --k:#14142b;
  --p:#5b3de0;
  --l:#c3ff00;
  --y:#ffe600;
  --d:#2a6f94;
  --r:#ff2d55;
  --g:calc(clamp(4.4rem,9.5vh,6rem) + env(safe-area-inset-bottom,0px));
  --sat:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px))
}
html{font-size:calc(min(100vw,480px)/24.375)}
*{box-sizing:border-box;margin:0;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body{background:var(--s);color:var(--k);font:700 1rem Onest,sans-serif;height:100vh;height:100dvh;overflow:hidden;overscroll-behavior:none}
button{font-family:Unbounded,sans-serif;font-weight:900;color:var(--k);cursor:pointer;transition:transform .08s,box-shadow .08s;border:none;background:none;padding:0}
button:active:not(.off):not(.static){transform:translate(.1rem,.1rem)}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:none}

/* Экраны */
.scr{position:fixed;inset:0;display:none;flex-direction:column;padding:calc(1.2rem + var(--sat)) 1.35rem calc(var(--g) + 1.1rem);max-width:480px;margin:auto}
.scr.on{display:flex}
#s,#x,#t{padding-bottom:var(--g)}

/* Главное меню */
.tp{display:flex;justify-content:flex-end;margin-bottom:.8rem}
.t{font:900 2.3rem/1.05 Unbounded,sans-serif;letter-spacing:-.03em}
.t b{display:inline-block;background:var(--p);color:#fff;font-size:2.4rem;padding:.25rem .7rem;margin:.45rem 0 0 -.4rem;border:.18rem solid var(--k);box-shadow:.35rem .35rem 0 var(--k);transform:rotate(-2deg)}
.card{background:#fff;border:.2rem solid var(--k);border-radius:1.55rem;box-shadow:.4rem .4rem 0 var(--k);padding:1.1rem 1.25rem}
#m .card{margin-top:1.5rem}
.card p{font-size:1.1rem;line-height:1.3;font-weight:800}
.card i{display:block;margin-top:.45rem;font-style:normal;color:var(--p)}
.sp{flex:1;min-height:6.5rem;display:flex;gap:2.2rem;justify-content:center;align-items:flex-end;margin:1.2rem 0 1.4rem}
.sp img{display:block;width:auto;max-width:44%;object-fit:contain;object-position:bottom;filter:drop-shadow(.3rem .3rem 0 var(--k))}
#i1{height:min(80%,10.4rem)}
#i2{height:min(100%,13rem)}

/* Кнопки */
.play{width:100%;display:inline-flex;align-items:center;justify-content:center;gap:.45rem;padding:.95rem 1.1rem;border:.2rem solid var(--k);border-radius:1.35rem;background:var(--k);color:var(--l);font-size:1.35rem;letter-spacing:-.02em;box-shadow:0 .32rem 0 var(--p);margin-top:.3rem;text-align:center}
.play.yl{background:var(--y);color:var(--k);box-shadow:0 .32rem 0 var(--k)}
.play.ok{background:var(--l);color:var(--k);box-shadow:0 .24rem 0 var(--k);cursor:default}
.play.off{background:rgba(20,20,43,.08);color:var(--d);box-shadow:none!important;border-style:dashed;border-color:var(--d);cursor:default}
.row{display:flex;gap:.85rem;margin-top:.9rem}
.sec{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:.3rem;padding:.9rem .8rem;border:.2rem solid var(--k);border-radius:1.35rem;background:#fff;font-size:1.08rem;box-shadow:.26rem .26rem 0 var(--k)}
.sec.yl{background:var(--y)}
.sec.dk{background:var(--k);color:var(--l);box-shadow:.26rem .26rem 0 var(--p)}
.sec.off{background:rgba(255,255,255,.4);border-style:dashed;border-color:var(--d);color:var(--d);box-shadow:none;cursor:default}
small{text-align:center;margin-top:.8rem;color:var(--d);font-size:.88rem}

/* Нижняя панель (трава и навигация магазина) */
.gr{position:fixed;left:0;right:0;bottom:0;height:var(--g);background:var(--l);border-top:.26rem solid var(--k);z-index:10}
.nv{max-width:480px;margin:0 auto;height:100%;display:flex;gap:.85rem;align-items:center;padding:0 1.35rem env(safe-area-inset-bottom,0px)}
.nv .sec{padding:.75rem .5rem;font-size:1.02rem;border-radius:1.2rem}

/* Шапка внутренних экранов */
.hd{display:flex;align-items:center;gap:.7rem;margin-bottom:.75rem;flex:none}
.hd h2{font:900 1.55rem/1 Unbounded,sans-serif;margin:0;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .bk{flex:none;padding:0;width:2.9rem;height:2.75rem;border-radius:1.05rem;display:grid;place-items:center;box-shadow:.2rem .2rem 0 var(--k)}
.bk svg{width:1.4rem;height:1.4rem;display:block}
.cn{display:inline-flex;align-items:center;gap:.42rem;background:var(--k);color:var(--y);font:900 1.02rem/1 Unbounded,sans-serif;padding:.45rem .8rem .45rem .52rem;border:.18rem solid var(--k);border-radius:1.05rem;box-shadow:0 .2rem 0 var(--p);flex:none}
.hd .cn{margin-left:auto}
.ci{width:1.4rem;height:1.4rem;object-fit:contain;flex:none;display:block}
.play .ci{width:1.5rem;height:1.5rem;margin:0}
.bad{visibility:hidden}.ci.bad{visibility:visible}

/* Оверлеи: Пауза, Game Over, Модалка */
#o,#p,#md{justify-content:center;background:rgba(20,20,43,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding-top:1rem;padding-bottom:1rem;z-index:20}
#o h2,#md h2{font:900 1.7rem/1.1 Unbounded,sans-serif;margin-bottom:.6rem}
#o .n{font:900 3.4rem/1 Unbounded,sans-serif;color:var(--p);margin:.2rem 0 .4rem}
#o .q,#p .q{font-size:.95rem;margin:.65rem 0 .4rem;opacity:.8}
.p-card{position:relative;padding:1.2rem 1.2rem 1.3rem;text-align:center}
.p-tag{display:inline-flex;align-items:center;gap:.5rem;background:var(--y);color:var(--k);font:900 1.35rem/1 Unbounded,sans-serif;padding:.38rem .9rem;border:.2rem solid var(--k);border-radius:1rem;box-shadow:.28rem .28rem 0 var(--k);transform:rotate(-2deg);margin-bottom:.8rem}
.p-tag i{display:inline-flex;gap:.22rem}
.p-tag i::before,.p-tag i::after{content:"";width:.34rem;height:1.1rem;background:var(--k);border-radius:.15rem}
.p-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin:.2rem 0 .75rem}
.p-stat{background:#f4f6fb;border:.18rem solid var(--k);border-radius:1.1rem;padding:.55rem .4rem;box-shadow:.22rem .22rem 0 var(--k)}
.p-stat span{display:block;font-size:.76rem;color:var(--d);text-transform:uppercase;letter-spacing:.04em}
.p-stat b{display:block;font:900 1.4rem/1.15 Unbounded,sans-serif;color:var(--p);margin-top:.15rem}
.p-stat.boss b{color:var(--r);font-size:1.15rem}

/* Топ чата */
.L{overflow-y:auto;flex:1;padding:.1rem .25rem 1.1rem 0;touch-action:pan-y}
.r{display:flex;align-items:center;gap:.75rem;background:#fff;border:.18rem solid var(--k);border-radius:1.2rem;padding:.55rem .85rem;margin-bottom:.6rem;box-shadow:.22rem .22rem 0 var(--k)}
.r.me{background:var(--y)}
.r b{width:1.6rem;font:900 .9rem Unbounded,sans-serif;flex:none}
.r span:nth-child(3){flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800}
.r em{font:900 1rem Unbounded,sans-serif;font-style:normal;color:var(--p)}
.r.me em{color:var(--k)}
.av{position:relative;width:2.35rem;height:2.35rem;border-radius:50%;border:.15rem solid var(--k);background:var(--p);color:#fff;display:grid;place-items:center;overflow:hidden;flex:none;font:900 .85rem Unbounded,sans-serif}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* === МАГАЗИН: ЭКРАН СКИНОВ (#s) === */
#s{overflow:hidden}
#s>*{flex:none}

/* Табы персонажей — все 4 ровно в один ряд без обрезки */
.tabs{display:flex;gap:.38rem;margin-bottom:.7rem}
.tabs .sec{flex:1 1 auto;min-width:0;padding:.52rem .35rem;font-size:.72rem;letter-spacing:-.02em;border-radius:.95rem;box-shadow:.18rem .18rem 0 var(--k);white-space:nowrap}
.tabs .sec.yl{background:var(--y)}

/* Витрина (превью скина + инфо-панель в единой карточке) */
.showcase{background:#fff;border:.2rem solid var(--k);border-radius:1.45rem;box-shadow:.32rem .32rem 0 var(--k);overflow:hidden;margin-bottom:.75rem}
.pv{position:relative;height:min(18dvh,8.2rem);background:radial-gradient(circle at 50% 58%,rgba(255,255,255,.75),transparent 62%),repeating-conic-gradient(rgba(255,255,255,.22) 0 9deg,transparent 9deg 20deg),var(--s);border-bottom:.18rem solid var(--k);overflow:hidden}
.cnt{position:absolute;right:.55rem;top:.5rem;z-index:2;font:900 .74rem/1 Unbounded,sans-serif;background:var(--k);color:var(--l);padding:.32rem .58rem;border-radius:.7rem}
.st{position:relative;width:100%;height:100%}
.st img{position:absolute;inset:.45rem;width:calc(100% - .9rem);height:calc(100% - .9rem);object-fit:contain;filter:drop-shadow(.2rem .2rem 0 var(--k))}
.pv.lk .st img{filter:brightness(0) opacity(.35)!important}
.qm{position:absolute;inset:0;display:grid;place-items:center;font:900 3rem Unbounded,sans-serif;font-style:normal;color:#fff;text-shadow:.16rem .16rem 0 var(--k);z-index:1}

/* Инфо-бар под превью */
.nm{display:flex;align-items:center;justify-content:space-between;gap:.65rem;padding:.65rem .85rem;background:#fff;min-height:3.85rem}
.ni{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:.18rem}
.ni .sn{margin:0;font:900 .96rem/1.15 Unbounded,sans-serif;color:var(--k);word-break:break-word}
.ni .by{display:flex;align-items:center;gap:.38rem;color:var(--d);font-size:.8rem;font-weight:800;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni .by .av{width:1.35rem;height:1.35rem;border-width:.11rem;font-size:.6rem}
.ni .al{display:block;font-size:.8rem;font-weight:800;color:var(--d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm .play{width:auto;flex:none;margin:0;padding:.58rem .85rem;font-size:.8rem;border-radius:.95rem;box-shadow:0 .2rem 0 var(--p)}
.nm .play.yl{box-shadow:0 .2rem 0 var(--k)}
.nm .play.ok{box-shadow:0 .18rem 0 var(--k)}

/* Сетка скинов: отдельный скролл-контейнер .gd и внутренняя сетка .gd-in, чтобы ряды никогда не сжимались */
#s>.gd{flex:1 1 0;min-height:0;overflow-y:auto;margin:0 -.25rem;padding:.1rem .25rem 1.1rem .05rem;touch-action:pan-y}
.gd-in{display:grid;grid-template-columns:repeat(4,1fr);gap:.65rem}
.gt{position:relative;display:block;width:100%;background:#fff;border:.18rem solid var(--k);border-radius:1.1rem;box-shadow:.2rem .2rem 0 var(--k);transition:transform .1s,background-color .15s,box-shadow .15s}
.gt::before,.dt::before{content:"";display:block;padding-bottom:100%}
.gt img,.dt img{position:absolute;inset:.38rem;width:calc(100% - .76rem);height:calc(100% - .76rem);object-fit:contain;display:block;z-index:1}
.gt.eq{background:#f2ffd6}
.gt.lk,.dt.lk{background:#d5dfef}
.gt.lk img,.dt.lk img{filter:brightness(0);opacity:.28}
.gt.lk::after,.dt.lk::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;font:900 1.4rem Unbounded,sans-serif;color:#fff;text-shadow:.1rem .1rem 0 var(--k);z-index:2}
.gt.on{background:var(--y);box-shadow:.24rem .24rem 0 var(--p);transform:translateY(-.08rem)}
.tg{position:absolute;top:.22rem;right:.22rem;width:1.25rem;height:1.25rem;display:flex;align-items:center;justify-content:center;background:var(--k);color:var(--l);font:900 .68rem/1 Unbounded,sans-serif;border-radius:.42rem;z-index:3}

/* === МАГАЗИН: ЭКРАН ЯЩИКА (#x) === */
#x{overflow-y:auto;touch-action:pan-y}
#x>*{flex:none}
#x .card{margin-bottom:1rem}
.bx{position:relative;overflow:hidden;isolation:isolate;background:radial-gradient(circle at 50% 24%,#8d70ff,var(--p) 66%);color:#fff;text-align:center;padding:1.15rem 1.15rem 1.1rem}
.bx::before{content:"";position:absolute;left:50%;top:-5.5rem;width:25rem;height:25rem;margin-left:-12.5rem;z-index:-1;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.14) 0 8deg,transparent 8deg 20deg);-webkit-mask-image:radial-gradient(circle,#000 18%,transparent 68%);mask-image:radial-gradient(circle,#000 18%,transparent 68%);animation:rot 26s linear infinite}
@keyframes rot{to{transform:rotate(1turn)}}
.bxi{width:8.2rem;height:8.2rem;margin:0 auto .4rem;animation:flt 2.4s ease-in-out infinite}
.bxi.shk{animation:wob .45s 2}
.bxi svg{width:100%;height:100%;display:block;overflow:visible}
@keyframes flt{0%,100%{transform:rotate(-5deg) translateY(0)}50%{transform:rotate(-2deg) translateY(-.4rem)}}
@keyframes wob{0%,100%{transform:rotate(-5deg)}20%{transform:rotate(10deg) scale(1.08)}40%{transform:rotate(-12deg)}60%{transform:rotate(9deg) scale(1.08)}80%{transform:rotate(-9deg)}}
.lid,.sp1,.sp2{transform-box:fill-box}
.lid{transform-origin:0 100%}
.shk .lid{animation:lid .9s ease-in-out}
@keyframes lid{40%{transform:translate(4px,-16px) rotate(-14deg)}}
.sp1,.sp2{transform-origin:center;animation:tw 1.6s ease-in-out infinite}
.sp2{animation-delay:.8s}
@keyframes tw{0%,100%{transform:scale(.5);opacity:.4}50%{transform:scale(1);opacity:1}}

.bx h2{font:900 1.45rem/1.1 Unbounded,sans-serif;margin-bottom:.3rem}
.bx p{margin:0 0 .8rem;font-size:.92rem;opacity:.92}
.bxp{position:relative;height:1.15rem;background:rgba(20,20,43,.45);border:.18rem solid var(--k);border-radius:.7rem;overflow:hidden;margin:0 0 .45rem}
.bxp span{display:block;height:100%;background:var(--l);transition:width .25s}
.bxn{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;font:900 .92rem/1 Unbounded,sans-serif;margin-bottom:.7rem}
.bxn .ci{width:1.2rem;height:1.2rem}
.bx .play.off{background:rgba(20,20,43,.28);color:rgba(255,255,255,.85);border-color:rgba(255,255,255,.55);box-shadow:none!important}
.bs{display:block;margin-top:.65rem;color:#fff;opacity:.85;font-size:.82rem}

/* Карточка «Что внутри» */
.hh{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-bottom:.75rem}
.hh h4{font:900 1.05rem/1 Unbounded,sans-serif;margin:0}
.hh span{font:900 .78rem/1 Unbounded,sans-serif;background:#f4f6fb;border:.15rem solid var(--k);padding:.28rem .55rem;border-radius:.65rem;color:var(--k)}
.dg{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}
.dt{position:relative;display:block;width:100%;border:.18rem solid var(--k);border-radius:1.05rem;background:#f4f6fb;box-shadow:.2rem .2rem 0 var(--k)}
.dt.got{background:var(--y)}
.dt .ok{position:absolute;top:.2rem;right:.2rem;width:1.2rem;height:1.2rem;display:flex;align-items:center;justify-content:center;border-radius:.4rem;background:var(--k);color:var(--l);z-index:3;font:900 .66rem/1 Unbounded,sans-serif}
.dt.lk .ok{background:var(--p);color:#fff}
.dn{color:var(--d);margin-top:.85rem;font-size:.85rem!important;line-height:1.25!important;background:#f4f6fb;border:.15rem dashed var(--d);border-radius:.85rem;padding:.55rem .7rem}

/* === МОДАЛКА ВЫПАДЕНИЯ (#md) === */
#md{text-align:center}
#md .card{width:100%}
#md h3{font:900 1.25rem/1.15 Unbounded,sans-serif;margin-bottom:.35rem}
.dp{position:relative;height:10rem;margin:.65rem 0 .8rem;background:var(--s);border:.2rem solid var(--k);border-radius:1.35rem;display:grid;place-items:center;overflow:hidden;isolation:isolate;--rc:#ffe600}
.dp::before{content:"";position:absolute;inset:-40%;z-index:-1;background:repeating-conic-gradient(var(--rc) 0 10deg,transparent 10deg 24deg);opacity:.5;animation:rot 18s linear infinite}
.dp img{max-width:80%;max-height:80%;object-fit:contain;position:relative;filter:drop-shadow(.22rem .22rem 0 var(--k));animation:pop2 .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop2{0%{transform:scale(.2) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
#md .by{display:inline-flex;justify-content:center;align-items:center;gap:.45rem;color:var(--d);margin:.1rem 0 .7rem;font-size:.88rem;font-weight:800}
#md .by .av{width:1.65rem;height:1.65rem;border:.14rem solid var(--k);font-size:.72rem}
#md .dup-msg{margin:.2rem 0 .7rem;color:var(--p);font-size:.98rem}
.rdy{position:relative}.rdy::after{content:"";position:absolute;top:-.4rem;right:-.3rem;width:.95rem;height:.95rem;background:var(--r);border:.18rem solid var(--k);border-radius:50%;animation:rdy 1.2s ease-in-out infinite}
@keyframes rdy{50%{transform:scale(1.25)}}

.score-sync-note{display:block!important;margin:.5rem 0!important;font:800 .78rem/1.35 Onest,sans-serif!important;color:var(--d);text-align:center}
.score-sync-note.error{color:#b00035}

/* Админ-панель владельца */
.adm-help{font-size:.82rem;line-height:1.35;color:var(--d);margin:.25rem 0 .7rem}
.adm-grid{display:grid;grid-template-columns:1fr 1fr;gap:.55rem;margin-top:.6rem}
.adm-grid .sec{font-size:.72rem;padding:.75rem .35rem;border-radius:.85rem;box-shadow:.16rem .16rem 0 var(--k)}
.adm-grid .sec.danger{background:#ffe1e6;color:#a00026}
.adm-grid .sec.purple{background:#5b3de0;color:#fff}
.adm-row{display:grid;grid-template-columns:1fr auto;gap:.5rem;align-items:end}
.adm-statgrid{display:grid;grid-template-columns:1fr 1fr;gap:.45rem;margin-top:.6rem}
.adm-stat{background:#f1f3fa;border:.14rem solid var(--k);border-radius:.8rem;padding:.55rem .65rem;min-width:0}
.adm-stat span{display:block;font-size:.66rem;color:var(--d);font-weight:900}
.adm-stat b{display:block;font:900 .9rem Unbounded,sans-serif;overflow-wrap:anywhere;margin-top:.2rem}
.adm-playerlist{display:flex;flex-direction:column;gap:.45rem;margin-top:.6rem}
.adm-player{width:100%;display:flex;gap:.5rem;align-items:center;text-align:left;background:#f1f3fa;border:.14rem solid var(--k);border-radius:.8rem;padding:.6rem;font:800 .8rem Onest,sans-serif}
.adm-player b{font:900 .75rem Unbounded,sans-serif;min-width:0;overflow:hidden;text-overflow:ellipsis}
.adm-player span{margin-left:auto;color:var(--p);white-space:nowrap}
.adm-result.ok{color:#267a20}.adm-result.err{color:#b00035}
.adm-divider{height:1px;background:#d8dce8;margin:.7rem 0}
#ad{padding-bottom:calc(var(--g) + .8rem)}
@media(max-width:360px){.adm-grid .sec{font-size:.64rem}.adm-player{font-size:.72rem}}

.adm-open{display:none;width:auto;flex:none;margin:0;background:#5b3de0;color:#fff;box-shadow:0 .22rem 0 #14142b;padding:.58rem .72rem;font-size:.68rem;border-radius:.85rem;white-space:nowrap}
#ad{overflow-y:auto;gap:.75rem;touch-action:pan-y}
#ad .adm-card{margin:0;padding:1rem}
.adm-note{font-size:.82rem;line-height:1.35;color:var(--d);margin:.35rem 0 .75rem}
.adm-label{display:block;font:900 .76rem Unbounded,sans-serif;margin:.55rem 0 .35rem;color:var(--k)}
.adm-input,.adm-select{display:block;width:100%;min-height:3rem;border:.18rem solid var(--k);border-radius:.85rem;background:#f4f6fb;color:var(--k);padding:.65rem .75rem;font:800 .95rem Onest,sans-serif;outline:none;user-select:text;-webkit-user-select:text}
.adm-action{width:100%;margin-top:.8rem}
.adm-result{font-size:.88rem;line-height:1.35;margin-top:.7rem;min-height:1.2rem;color:var(--p);overflow-wrap:anywhere}
.adm-section{font:900 .78rem Unbounded,sans-serif;margin-bottom:.35rem}

#m .play+.play{margin-top:.75rem}
.pt{font:900 1.5rem/1 Unbounded,sans-serif;margin-bottom:.2rem}
.pn{font:900 3.8rem/1 Unbounded,sans-serif;color:var(--p);margin:.7rem 0 .45rem}
.pi{color:var(--d);font-size:.95rem!important;margin-bottom:1.1rem}
#p .row .dk{flex:1.5;color:#fff}
@keyframes sin{from{opacity:0;transform:translateY(1rem) scale(.98)}}
@keyframes cpop{0%{transform:scale(.8) translateY(1rem);opacity:0}100%{transform:none;opacity:1}}
@keyframes bob{50%{transform:translateY(-.45rem)}}
@keyframes pls{50%{box-shadow:0 .32rem 0 var(--p),0 0 0 .55rem rgba(91,61,224,.22)}}
@keyframes rin{from{opacity:0;transform:translateX(1.2rem)}}
@keyframes bmp{40%{transform:scale(1.25) rotate(-3deg)}}
@keyframes drop{from{opacity:0;transform:translateY(-1.2rem) rotate(-6deg)}}

async function adminWalletUpdate(changeFn,success){
 if(!IS_ADMIN||!db){admSay('Нет доступа или Firebase не подключён.','err');return false}
 const target=admTarget();if(!admValid(target)){admSay('Введи корректный Telegram ID.','err');return false}
 admSay('Сохраняю изменения…');
 try{
  const ref=db.collection('wallets').doc('t'+target);let updated=null;
  await db.runTransaction(async tx=>{
   const snap=await tx.get(ref),old=snap.exists?(snap.data()||{}):{};
   const base={...old,c:Math.max(0,Number(old.c)||0),v:Math.max(0,Number(old.v)||0),own:Array.isArray(old.own)?old.own.slice():[],eq:old.eq&&typeof old.eq==='object'?{...old.eq}:{},ch:old.ch||'il',bx:Math.max(0,Number(old.bx)||0),pt:Math.max(0,Number(old.pt)||0)};
   if(target===ADMIN_ID){base.c=Math.max(base.c,Number(WL.c)||0);base.v=Math.max(base.v,Number(WL.v)||0);base.own=[...new Set([...base.own,...(Array.isArray(WL.own)?WL.own:[])])];base.eq={...(WL.eq||{}),...base.eq};base.ch=base.ch||WL.ch||'il';base.bx=Math.max(base.bx,Number(WL.bx)||0);base.pt=Math.max(base.pt,Number(WL.pt)||0)}
   const patch=changeFn(base)||{};
   updated={...base,...patch,v:Math.max(base.v,target===ADMIN_ID?(Number(WL.v)||0):0)+1,t:FV.serverTimestamp()};
   tx.set(ref,updated,{merge:true});
  });
  if(target===ADMIN_ID){WL={...WL,c:updated.c,v:updated.v,own:updated.own,eq:updated.eq,ch:updated.ch,bx:updated.bx,pt:updated.pt};wd=0;try{localStorage.wl=JSON.stringify(WL)}catch{}cshow();ap();if(cs==='s')rsk();if(cs==='x')rbx()}
  await adminLoadPlayer();admSay(success||'Изменения сохранены.','ok');return true;
 }catch(err){console.error('admin wallet update failed',err);admSay('Firebase отклонил изменение. Возможна ошибка Firestore Rules или сети. '+(err?.code||''),'err');return false}
}
async function adminCoins(mode){

 if(!Number.isFinite(raw)||raw<0||!Number.isSafeInteger(amount)){admSay('Введи целое неотрицательное число монет.','err');return}
 await adminWalletUpdate(p=>{let c=p.c;if(mode==='add')c+=amount;else if(mode==='sub')c=Math.max(0,c-amount);else c=amount;if(!Number.isSafeInteger(c))throw new Error('balance overflow');return {c}},mode==='add'?`Выдано ${amount} монет.`:mode==='sub'?`Снято ${amount} монет (ниже нуля баланс не опускается).`:`Баланс установлен: ${amount} монет.`);
}
